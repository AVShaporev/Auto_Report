[tool.poetry]
name = "auto-report"
version = "0.1.0"
description = ""
authors = ["Andrey Shaporev <ashaporev@list.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.12"
uvicorn = "^0.34.2"
pydantic = {extras = ["email"], version = "^2.12.5"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = "^1.7.4"
python-multipart = "^0.0.20"
pytest = "^8.3.4"
jinja2 = "^3.1.5"
sqlalchemy = "^2.0.38"
aiosqlite = "^0.21.0"
bcrypt = "4.0.1"
alembic = "^1.14.1"
pydantic-settings = "^2.8.0"
asyncpg = "^0.30.0"
requests = "^2.32.3"
loguru = "^0.7.3"
fastapi-filter = "^2.0.1"
logging = "^0.4.9.6"
weasyprint = "^68.1"
img2pdf = "^0.6.3"
pillow = "^12.2.0"
pillow-heif = "^1.3.0"
pypdf = "^6.10.2"


[tool.poetry.group.dev.dependencies]
python-docx = "^1.2.0"
pytest-asyncio = "^0.25.0"
httpx = "^0.27.2"

[tool.pytest.ini_options]
# Тесты лежат в ./tests, asyncio_mode=auto означает что
# async-функции с префиксом test_* не нужно помечать @pytest.mark.asyncio.
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-ra --strict-markers --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:jose.*",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
