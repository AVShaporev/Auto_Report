# Auto_Report — деплой бэка hi-tech на VDS (188.120.227.138, hi-tech.cool-doc.ru).
#
# Триггер: НЕ push, а `workflow_run` от build-tenant-image.yml по completion.
# Порядок событий на push в prod:
#   1. push → build-tenant-image workflow стартует (build + push ghcr + retag на VDS).
#   2. Он завершается (~4-6 мин).
#   3. Этот workflow triggerится через workflow_run → SSH на VDS → deploy.sh backend.
#   4. deploy.sh делает `docker compose up -d backend` (БЕЗ --build): compose видит
#      обновлённый auto-report-tenant:latest и recreate'ит контейнер за ~10с.
# Без такого ordering'а был race: deploy.sh стартовал в ту же секунду что и build,
# успевал сделать compose up с ЕЩЁ старым образом → hi-tech оставался на прошлой
# версии. И заодно docker build на VDS был единой точкой отказа (см. коммит
# «switch hi-tech to pre-built image»).
#
# Параллельно с этим срабатывает старый .github/workflows/deploy.yml, который
# обновляет 192.168.1.8 prod (bare-metal) — он на self-hosted runner'е и не
# зависит от VDS-инфры.
#
# Runner: GitHub-hosted ubuntu-latest, SSH-ится на VDS через appleboy/ssh-action.
# Не self-hosted — на VDS лишний runner-процесс ел бы ~150 MB RAM.
#
# Secrets, нужные в репо (Settings → Secrets and variables → Actions):
#   SSH_HOST          — 188.120.227.138
#   SSH_PRIVATE_KEY   — приватка из /home/deploy/.ssh/github_deploy (см. §2.7 VDS deploy)
# SSH-порт жёстко прописан здесь (48461 — пользовательский, см. §2.4 VDS deploy).

name: Deploy backend to VDS

on:
  # Ждём завершения build-tenant-image (образ retag'нут на VDS) — только тогда
  # имеет смысл делать docker compose up на hi-tech.
  workflow_run:
    workflows: ["Build tenant image"]
    types: [completed]
    branches: [prod]
  workflow_dispatch:

# Один деплой за раз. cancel-in-progress=false — нельзя обрывать docker
# compose up на полпути, лучше дать закончить и стартовать второй.
concurrency:
  group: deploy-vds-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Ключевое условие: workflow_run триггерится даже если build упал.
    # Не хотим катить hi-tech на потенциально сломанном/старом образе.
    # workflow_dispatch (manual) пропускаем всегда — юзер знает, что делает.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: SSH and run deploy.sh backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 48461
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # script_stop: true → если внутри скрипта команда падает, action тоже красный.
          script_stop: true
          script: |
            /opt/auto-report/scripts/deploy.sh backend

      - name: Healthcheck https://hi-tech.cool-doc.ru/api/health
        id: health_hi_tech
        run: |
          # Compose recreate + alembic upgrade + tini → uvicorn ~15-40s.
          # 45 итераций × 4s = 180s суммарного таймаута.
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 \
                https://hi-tech.cool-doc.ru/api/health) || code=000
            if [ "$code" = "200" ]; then
              echo "✅ Backend healthy после ~$((i*4))s"
              exit 0
            fi
            echo "[$i/45] HTTP $code — wait 4s"
            sleep 4
          done
          echo "❌ Healthcheck failed после 180s — последний код $code"
          exit 1

      # ================================================================
      # Fan-out: раскатить свежий tenant-image на всех SaaS-tenant'ов.
      # ================================================================
      # hi-tech — legacy монолит, обновляется через /opt/auto-report/scripts/deploy.sh.
      # SaaS-тенанты (/opt/auto-report/tenants/<slug>/) сидят на pre-built образе
      # auto-report-tenant:latest, который build-tenant-image workflow только что
      # retag'нул на VDS. redeploy-tenants.sh без --pull делает `docker compose up
      # -d --force-recreate` для каждого тенанта — контейнер подхватывает свежий
      # образ.
      #
      # Требование к VDS (одноразово):
      #   /etc/sudoers.d/deploy-redeploy-tenants:
      #     deploy ALL=(root) NOPASSWD: /opt/auto-report-master/Auto_Report_Master/scripts/redeploy-tenants.sh
      # SOPS-ключ /etc/sops/age/keys.txt (mode 640 root:github-runner) для deploy'я
      # недоступен без sudo — поэтому запускаем через sudo NOPASSWD.
      #
      # Fail-mode: скрипт не fail-fast (see redeploy-tenants.sh comment), один
      # упавший tenant не блокирует остальных, но exit non-zero → GHA красный.
      - name: Fan-out redeploy SaaS tenants
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 48461
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            # flock: если parallel Auto_report_front/deploy-vds уже держит lock
            # (при синхронном merge в оба репо оба workflow бегут одновременно),
            # ждём его до 15 мин, чтобы не запустить два docker compose up на
            # одном контейнере (race → один из recreate падает).
            flock -w 900 /tmp/redeploy-tenants.lock -c \
              'sudo /opt/auto-report-master/Auto_Report_Master/scripts/redeploy-tenants.sh --skip-caddy-reload'
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile || echo "⚠️  caddy reload failed"
