# .sops.yaml — конфиг для Mozilla SOPS
#
# Описывает creation_rules: какие файлы каким набором получателей
# (recipients) шифровать. Когда ты вызываешь `sops -e file`, SOPS
# смотрит на путь файла, матчит против path_regex, и берёт
# соответствующих recipients (мы используем age — современный
# наследник GPG, см. https://github.com/FiloSottile/age).
#
# Создан в рамках Этапа 0 SaaS-плана (2026-06-15) — переход с plain
# .env на encrypted-in-git подход. Подробнее в memory
# project_autoreport_saas_roadmap.md.
#
# ВАЖНО: приватная часть age-ключа НИКОГДА не попадает в git.
# Она лежит:
# - локально в ~/.config/sops/age/keys.txt (для разработчика);
# - на каждом сервере в /etc/sops/age/keys.txt mode 0400 root:root
#   (для расшифровки во время деплоя);
# - бэкапом в Bitwarden как "autoreport-sops-age-master".
#
# При ротации master-ключа (если приватный скомпрометирован) нужно:
# 1) Сгенерировать новый age-ключ.
# 2) Запустить `sops updatekeys deploy/secrets/*.env.sops` со
#    старым ключом в keys.txt — он перешифрует файлы под новый
#    recipient (тот, что в этом .sops.yaml).
# 3) Обновить age:-строку ниже на новый public ключ, коммит.
# 4) Положить новый приватный ключ на серверы и в Bitwarden.

creation_rules:
  # SOPS требует, чтобы хотя бы одно правило матчило путь файла,
  # с которым он работает (input при encrypt'е, output при edit'е).
  # Регекс ниже умышленно широкий — матчит ЛЮБОЙ *.env, *.env.raw,
  # *.env.sops, в любой директории, включая /tmp/, $TEMP, репозиторий.
  # Это нормально, потому что recipient везде один и тот же
  # (single-developer проект, см. комментарий ниже).
  #
  # На каждый env (vds-prod, 192-stage, 192-prod, потом per-tenant)
  # будет свой файл `deploy/secrets/<env>.env.sops`. Recipient у всех
  # пока один — упрощает ротацию и не теряет ничего в безопасности,
  # потому что все сервера админит один человек.
  #
  # Когда (если) появятся независимые админы или раздельные среды
  # с разной чувствительностью — заведём отдельные age-ключи и
  # допишем сюда правила с разными `age:` значениями + более
  # специфичными path_regex'ами.
  - path_regex: '\.env(\.[a-zA-Z0-9_-]+)?$'
    age: age1drlaj7wf4y4mfq6r7uqt4qy8qdalcmes2y8zhx6nmhnqwpt3lghqsqvte3
