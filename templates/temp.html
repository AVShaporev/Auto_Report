<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI + Bootstrap Modal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#noteModal">
            Добавить запись
        </button>

        <!-- Таблица для отображения данных -->
        <table class="table mt-3" id="notesTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Заголовок</th>
                    <th>Содержание</th>
                </tr>
            </thead>
            <tbody>
                <!-- Данные будут здесь -->
            </tbody>
        </table>
    </div>

    <!-- Модальное окно -->
    <div class="modal fade" id="noteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Новая запись</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="noteForm">
                        <div class="mb-3">
                            <label class="form-label">Заголовок</label>
                            <input type="text" class="form-control" id="title" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Содержание</label>
                            <textarea class="form-control" id="content" rows="3" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                    <button type="button" class="btn btn-primary" onclick="submitNote()">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS + Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Кастомный JS -->
    <script>
        // Загрузка данных при открытии страницы
        document.addEventListener('DOMContentLoaded', loadNotes);

        async function loadNotes() {
            const response = await fetch('/notes');
            const notes = await response.json();
            const tableBody = document.querySelector('#notesTable tbody');
            tableBody.innerHTML = notes.map(note => `
                <tr>
                    <td>${note.id}</td>
                    <td>${note.title}</td>
                    <td>${note.content}</td>
                </tr>
            `).join('');
        }

        // Отправка данных формы
        async function submitNote() {
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;

            const response = await fetch('/notes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    title: title,
                    content: content
                })
            });

            if (response.ok) {
                // Закрыть модальное окно
                const modal = bootstrap.Modal.getInstance(document.getElementById('noteModal'));
                modal.hide();
                
                // Очистить форму
                document.getElementById('noteForm').reset();
                
                // Обновить таблицу
                loadNotes();
            }
        }
    </script>
</body>
</html>
