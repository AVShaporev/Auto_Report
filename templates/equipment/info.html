{% extends "base.html" %}

{% block title %}
    Информация об оборудовании
{% endblock %}

{% block content %}

    <body align="center">

        <h4>Наименование/Модель</h4>
        
        <h5><a href="{{ url_for_google }}" 
                class="text-decoration-none text-dark p-3">
                {{ equipment.name }}
            </a>
        </h5>
        <div>

            <table class="table table-striped table-hover">

                <tbody>
                        <tr class="table-row">
                                <th scope="row">ID</th>
                                <td>{{ equipment.id }}</td>
                        </tr>
                        
                        <tr class="table-row">
                                <th scope="row">Тип оборудования</th>
                                <td>
                                    {{ equipment.spec_equipment.name }}
                                </td>
                        </tr>

                </tbody>

                
            </table>

        </div>

    </body>

{% endblock %}
