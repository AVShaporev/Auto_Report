{% extends "base.html" %}

{% block title %}
    Добавить контракт
{% endblock %}

{% block content %}

    <body align="center">

        <form action='/contract/create' method='POST'>

            <h3>Добавление контракта/договора</h3>

            <div class="mb-3">
                Вид контракта/договора
                <select name='spec_contract'>
                    {% for spec_contract in spec_contracts %}
                        <option contract_id value={{spec_contract.id}}>{{spec_contract.name}}</option>
                    {% endfor %}
                </select>
            </div>

<div class="mb-3">
                Заказчик
                <select name='customer_id'>
                    {% for customer in customers %}
                        <option contract_id value={{customer.id}}>{{customer.name}}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                Подрядчик
                <select name='executor_id'>
                    {% for executor in executors %}
                        <option contract_id value={{executor.id}}>{{executor.name}}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3 row">
                <label for="text" class="col-sm-2 col-form-label">Номер контракта</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="number" name='number'>
                </div>
            </div>

            <div class="mb-3 row">
                <label for="datepicker" class="col-sm-2 col-form-label">Дата заключения контракта</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control datepicker" id="datepicker" data-provide="datepicker" name='date_of_consclusion'>
                </div>
            </div>

            <div class="mb-3 row">
                <label for="datepicker" class="col-sm-2 col-form-label">Срок действия контракта</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control datepicker" id="datepicker" data-provide="datepicker" name='date_of_completion'>
                </div>
            </div>

            <div class="mb-3 row">
                <label for="text" class="col-sm-2 col-form-label">Сумма контракта</label>
                <div class="col-sm-10">
                    <input type="float" class="form-control" id="summ" name='summ'>
                </div>
            </div>

            <div class="mb-3 row">
                <label for="text" class="col-sm-2 col-form-label">Предмет контракта</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="subject" name='subject'>
                </div>
            </div>

            <div class="mb-3 row">
                <label for="text" class="col-sm-2 col-form-label">Сокращенно предмет контракта</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="short_subject" name='short_subject'>
                </div>
            </div>

            <div class="mb-3 row">
                <label for="text" class="col-sm-2 col-form-label">Вид расчета (равными долями/по единице)</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="type_contract" name='type_contract'>
                </div>
            </div>

            <div class="mb-3 row">
                <label for="text" class="col-sm-2 col-form-label">Описание, дополнение, комментарий</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="description" name='description'>
                </div>
            </div>

            <input type='submit' value='Сохранить'>
            
        </form>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/locales/bootstrap-datepicker.ru.min.js"></script>

        <script>
            $(document).ready(function() {
                $('.datepicker').datepicker({
                    format: 'dd.mm.yyyy',
                    language: 'ru',
                    autoclose: true,
                    todayHighlight: true
                });
            });
        </script>

    </body>

{% endblock %}
