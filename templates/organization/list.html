{% extends "base.html" %}

{% block title %}
    Справочник орагнизаций
{% endblock %}

{% block content %}

    <body align="center">
        
        <h1>Организации</h1>
        <div>

            <table class="table table-hover">
                <thead>
                    <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Наименование</th>
                    <th scope="col">ИНН</th>
                    </tr>
                </thead>

                <tbody>
                    {% for organization in organizations %}
                        <tr>
                            <th scope="row">{{ organization.id }}</th>
                            <td>{{ organization.name }}</td>
                            <td>{{ organization.inn }}</td>
                        </tr>
                    {% endfor %}
                </tbody>

                
            </table>

        </div>

    </body>

{% endblock %}
