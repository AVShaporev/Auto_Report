{% extends "base.html" %}

{% block title %}
    Новый пользователь
{% endblock %}

{% block content %}

        <form action='/user/create' method='POST'>

            <h3 class="text-center">Новый пользователь</h3>

            <div class="mb-3 row">
                <label for="name" class="col-sm-2 col-form-label ps-5">Имя пользователя</label>
                <div class="col-sm-10 pe-5">
                    <input type="text" class="form-control" id="name" 
                            name='name' autocomplete="name" 
                            placeholder="Введите имя пользователя"
                            required>
                </div>
            </div>

            <div class="mb-3 row">
                <label for="description" class="col-sm-2 col-form-label ps-5">Описание</label>
                <div class="col-sm-10 pe-5">
                    <input type="text" class="form-control" id="description" 
                            name='description' 
                            placeholder="Введите дополнительное описание для создаваемого пользователя, если необходимо"
                            required>
                </div>
            </div>

            <!-- Выпадающий список ролей пользователей -->
            <div class="mb-3 ps-5 pe-5">
                <label class="form-label">Роль создаваемого пользователя</label>
            
            <!-- Основной dropdown -->
            <div class="dropdown">

                <!-- Кнопка для открытия списка -->
                <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start" 
                        type="button" 
                        id="roleBtn" 
                        data-bs-toggle="dropdown" 
                        aria-expanded="false">
                Выбрать роль
                </button>
                
                <!-- Выпадающее меню с поиском -->
                <div class="dropdown-menu w-100 p-2">

                <!-- Поле поиска -->
                <div class="px-2 mb-2">
                    <input type="text" 
                        class="form-control" 
                        placeholder="Поиск..." 
                        id="roleSearch">
                </div>
                <div class="dropdown-divider"></div>
                
                    <!-- Список наиманований ролей с прокруткой -->
                    <div class="overflow-auto" id="roles-list" style="max-height: 200px;">
                        <button class="dropdown-item" type="button" value="create">
                            Создать новую роль
                        </button>
                        {% for role in roles %}
                            <button class="dropdown-item" type="button" value="{{ role.id }}">
                                {{ role.name }}
                                </button>
                        {% endfor %}
                    </div>

                </div>
            </div>
            
            <!-- Скрытое поле для формы -->
            <input type="hidden" name="role_id" id="selectedRole">
            </div>

            <script>
            // Обработка кнопки "Сохранить" в модальном окне создания роли пользователя
            async function submitRole() {
                const name = document.getElementById('name_of_role').value.trim();
                const description = document.getElementById('description').value.trim();

                if (!name) {
                    alert("Введите название роли");
                    return;
                }

                try {
                    // Отправка данных на сервер
                    const response = await fetch('/api/role/create', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({name, description})
                    });

                    if (!response.ok) {
                        throw new Error(`Ошибка сервера: ${response.status}`);
                    }

                    const data = await response.json();

                    // Контейнер списка ролей
                    const rolesList = document.getElementById('roles-list');

                    // Создание новой кнопки-элемента
                    const newButton = document.createElement('button');
                    newButton.className = 'dropdown-item';
                    newButton.type = 'button';
                    newButton.value = data.id;
                    newButton.textContent = data.name;

                    // Добавление обработчика клика
                    newButton.addEventListener('click', function() {
                        document.getElementById('roleBtn').textContent = this.textContent;
                        document.getElementById('selectedRole').value = this.value;
                    });

                    // Вставка новой кнопки перед разделителем или в конец списка
                    const divider = document.querySelector('.dropdown-divider');
                    if (divider) {
                        divider.insertAdjacentElement('afterend', newButton);
                    } else {
                        dropdownList.appendChild(newButton);
                    }

                    // Обновление выбранного значения
                    document.getElementById('roleBtn').textContent = data.name;
                    document.getElementById('selectedRole').value = data.id;

                    // Закрытие модального окна
                    bootstrap.Modal.getInstance(document.getElementById('role_Modal')).hide();

                    // Очистка полей формы модельного окна
                    document.getElementById('name_of_role').value = '';
                    document.getElementById('description').value = '';

                     } catch (error) {
                        console.error("Ошибка:", error);
                        alert("Не удалось сохранить роль: " + error.message);
                    }

                }
            </script>

            <!-- Модальное окно добавление новой роли пользователя-->
            <div class="modal fade" id="role_Modal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Новое наименование роли пользователя</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                                <div class="mb-3">
                                    <label for="name_of_role" class="form-label">Наименование</label>
                                    <input type="text" class="form-control" id="name_of_role" name="name_of_role" autocomplete="name_of_role">
                                </div>
                                <div class="mb-3">
                                    <label for="description" class="form-label">Описание</label>
                                    <textarea class="form-control" id="description" name="description" autocomplete="description"></textarea>
                                </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                            <button type="button" class="btn btn-primary" onclick="submitRole()">Сохранить</button>
                        </div>
                    </div>
                </div>
            </div>

        </form>

        <!-- Подключаемые библиотеки -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/locales/bootstrap-datepicker.ru.min.js"></script>

        <!-- Подключаемые локальные скрипты -->
        <script src="{{ url_for('static', path='/js/role_modal.js') }}"></script>
        


{% endblock %}
