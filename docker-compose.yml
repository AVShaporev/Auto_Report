# Auto_Report — docker compose оркестратор для VDS-деплоя.
#
# Где живёт на VDS:
#   /opt/auto-report/
#   ├── Auto_Report/                   ← git clone бэка, этот файл тут
#   │   docker-compose.yml             ← (текущий файл)
#   ├── Auto_report_front/             ← git clone фронта (рядом, см. build.context)
#   ├── .env                           ← пароли + DB-конфиг, chmod 600, НЕ В GIT
#   ├── backups/                       ← cron pg_dump кладёт сюда (§8)
#   └── scripts/
#       └── deploy.sh                  ← GHA workflow дёргает (§6)
#
# Запуск из /opt/auto-report/Auto_Report/:
#   docker compose up -d --build
#
# Compose автоматически подхватывает ../.env через env_file у каждого сервиса.
# `version:` тег не нужен — он deprecated с compose v2+.

# =====================================================================
# Сети
# =====================================================================
networks:
  # Внутренняя сеть для всех трёх сервисов. Driver bridge.
  # postgres и backend без `ports:` — они доступны только через ar_net.
  ar_net:
    driver: bridge

  # Внешняя сеть для SaaS Caddy (см. Auto_Report_Master/caddy/). К ней
  # подключаем только frontend — Caddy ходит сюда на auto-report-frontend:80
  # и резолвит имя по docker-DNS. Внутренняя маршрутизация на backend
  # (через nginx proxy_pass) остаётся в ar_net.
  ar_caddy:
    external: true

# =====================================================================
# Тома (named volumes)
# =====================================================================
volumes:
  # БД PostgreSQL. Лежит в /var/lib/docker/volumes/auto-report_pg_data/_data/
  # Docker сам ставит правильный uid 999 (postgres user внутри образа).
  # Переживает docker compose down / rebuild контейнера / переустановку backend.
  pg_data:

  # Вложения к заявкам/отчётам + шаблоны .docx — приходят через UI.
  # Хранится в /var/lib/docker/volumes/auto-report_backend_media/_data/
  # Бэкапим cron'ом (§8).
  backend_media:

  # Логи Loguru. Не критично терять, но удобно иметь на пересборку.
  backend_logs:

# =====================================================================
# Сервисы
# =====================================================================
services:

  # -------------------------------------------------------------------
  # PostgreSQL 16 — БД для бэка
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: auto-report-postgres
    restart: unless-stopped

    # Все POSTGRES_* читает init-скрипт образа postgres при первом запуске.
    # При последующих запусках pg_data уже инициализирована — переменные
    # игнорятся. ВАЖНО: если меняешь POSTGRES_PASSWORD после первого старта,
    # это НЕ ротирует пароль в БД, надо вручную ALTER USER через psql.
    # ENV_FILE экспортируется deploy_vds.sh после расшифровки SOPS-файла
    # (scripts/decrypt-env.sh vds-prod). Дефолт `../.env` оставлен на случай
    # ручного `docker compose up` без SOPS — на чистом stage / dev-машине.
    # На VDS этот дефолт больше не должен срабатывать после раскатки SOPS.
    env_file:
      - ${ENV_FILE:-../.env}

    # Локальный 5432:5432 — наружу не торчит (только loopback хоста),
    # достаём из DBeaver через SSH-туннель:
    #   ssh -p 48461 -L 5432:127.0.0.1:5432 root@188.120.227.138
    # Дальше в DBeaver → localhost:5432, юзер из .env.
    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data

    # Healthcheck нужен — backend.depends_on.condition=service_healthy
    # не пустит uvicorn раньше готовности postgres.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-autoreport}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # На 1.8GB RAM ограничиваем postgres ~300MB,
    # чтобы он не съел весь буфер у бэка под нагрузкой.
    mem_limit: 300m

    networks:
      - ar_net

  # -------------------------------------------------------------------
  # Backend — FastAPI + uvicorn
  # -------------------------------------------------------------------
  backend:
    container_name: auto-report-backend
    restart: unless-stopped

    # image (не build) — pre-built образ из ghcr.io, тот же что и у
    # SaaS-tenant'ов (Auto_Report_Master/templates/tenant-compose.yml.tpl).
    # Собирается в GHA (.github/workflows/build-tenant-image.yml) на
    # GitHub-hosted runner'е, пушится в ghcr.io/<owner>/auto-report-tenant,
    # затем notify-vds job'а делает docker pull + docker tag ... в короткое
    # имя auto-report-tenant:latest на самом VDS.
    #
    # Почему это критично для hi-tech: раньше docker compose --build пытался
    # тянуть poetry с pypi.org во время build'а, и любой сбой pypi/сетевая
    # проблема на VDS валила деплой. Теперь VDS только запускает готовый
    # артефакт — no pip, no pypi, детерминированно.
    image: auto-report-tenant:latest

    # DB_*, SECRET_KEY, ALGORITHM, ACCESS_TOKEN_EXPIRE_MINUTES,
    # REFRESH_TOKEN_EXPIRE_DAYS, MEDIA_ROOT — всё в одном .env.
    # ENV_FILE экспортируется deploy_vds.sh после расшифровки SOPS-файла
    # (scripts/decrypt-env.sh vds-prod). Дефолт `../.env` оставлен на случай
    # ручного `docker compose up` без SOPS — на чистом stage / dev-машине.
    # На VDS этот дефолт больше не должен срабатывать после раскатки SOPS.
    env_file:
      - ${ENV_FILE:-../.env}

    # Не пробрасываем :8000 наружу — Caddy → frontend-nginx → backend:8000
    # внутри docker-network.

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      # Вложения к заявкам/отчётам + шаблоны.
      # MEDIA_ROOT в .env должен указывать на /app/media (внутри контейнера).
      - backend_media:/app/media
      # Логи Loguru.
      - backend_logs:/app/logs

    # Backend читает заголовки X-Forwarded-Proto от frontend-nginx,
    # значит uvicorn должен видеть proxy-headers — выставлено в entrypoint.sh.

    mem_limit: 700m

    networks:
      - ar_net

  # -------------------------------------------------------------------
  # Frontend — SPA в nginx
  # -------------------------------------------------------------------
  frontend:
    container_name: auto-report-frontend
    restart: unless-stopped

    # image (не build) — pre-built образ из ghcr.io, тот же что и у
    # SaaS-tenant'ов. Собирается в Auto_report_front/.github/workflows/
    # build-tenant-image.yml на GitHub-hosted runner'е (Node + npm build
    # съедают ~2GB RAM во время сборки — на 2GB VDS OOM неизбежен).
    # notify-vds retag'ает в короткое имя auto-report-front-tenant:latest.
    image: auto-report-front-tenant:latest

    # Caddy в контейнере (см. Auto_Report_Master/caddy/) ходит сюда по
    # docker-DNS через ar_caddy сеть → auto-report-frontend:80, без host-портов.
    # 127.0.0.1:8080 оставляем как fallback для host-Caddy / отладки.
    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      - backend

    mem_limit: 100m

    networks:
      - ar_net
      - ar_caddy
